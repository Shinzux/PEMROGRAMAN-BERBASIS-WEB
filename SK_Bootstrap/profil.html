
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profil Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="index.html">Admin Panel</a>
    <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menuAtas">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="menuAtas">
      <div class="navbar-nav ms-auto">
        <a class="nav-link active" href="profil.html">Profil</a>
        <a class="nav-link" href="logout.html">Logout</a>
      </div>
    </div>
  </div>
</nav>

<div class="container-fluid">
  <div class="row">
    <aside class="col-md-3 col-lg-2 bg-white border-end min-vh-100 p-3">
      <h5>Menu Utama</h5>
      <nav class="nav nav-pills flex-column gap-1">
        <a class="nav-link" href="index.html">Dashboard</a>
        <a class="nav-link" href="laporan.html">Laporan</a>
        <a class="nav-link" href="pengguna.html">Pengguna</a>
        <a class="nav-link" href="pengaturan.html">Pengaturan</a>
      </nav>
    </aside>

    <main class="col-md-9 col-lg-10 p-4">
      <h1>Profil Admin</h1>

      <div class="card shadow-sm" style="max-width: 600px;">
        <div class="card-body">
          <h4 id="namaTampil">Admin</h4>
          <p id="emailTampil" class="text-secondary">admin@example.com</p>
          <p><strong>Peran:</strong> Administrator</p>

          <button class="btn btn-primary" id="tombolEdit">Edit Profil</button>

          <form id="formProfil" class="mt-3 d-none">
            <div class="mb-3">
              <label for="nama" class="form-label">Nama</label>
              <input class="form-control" id="nama" value="Admin" required>
            </div>
            <div class="mb-3">
              <label for="email" class="form-label">Email</label>
              <input type="email" class="form-control" id="email"
                     value="admin@example.com" required>
            </div>
            <button type="submit" class="btn btn-success">Simpan</button>
            <button type="button" class="btn btn-secondary" id="batalEdit">Batal</button>
          </form>

          <div id="pesan" class="alert alert-success mt-3 d-none">
            Profil berhasil diperbarui.
          </div>
        </div>
      </div>

      <a href="index.html" class="btn btn-secondary mt-3">Kembali ke Dashboard</a>

      <footer class="border-top mt-5 pt-3 text-center text-secondary">
        &copy; 2026 Muhammad Al Faruq
      </footer>
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script>
  const form = document.getElementById("formProfil");

  document.getElementById("tombolEdit").addEventListener("click", function() {
    form.classList.remove("d-none");
    document.getElementById("pesan").classList.add("d-none");
  });

  document.getElementById("batalEdit").addEventListener("click", function() {
    form.classList.add("d-none");
  });

  form.addEventListener("submit", function(event) {
    event.preventDefault();

    document.getElementById("namaTampil").textContent =
      document.getElementById("nama").value;
    document.getElementById("emailTampil").textContent =
      document.getElementById("email").value;

    form.classList.add("d-none");
    document.getElementById("pesan").classList.remove("d-none");
  });
</script>
</body>
</html>
