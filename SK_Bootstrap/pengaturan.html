
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pengaturan</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="index.html">Admin Panel</a>
    <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menuAtas">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="menuAtas">
      <div class="navbar-nav ms-auto">
        <a class="nav-link" href="profil.html">Profil</a>
        <a class="nav-link" href="logout.html">Logout</a>
      </div>
    </div>
  </div>
</nav>

<div class="container-fluid">
  <div class="row">
    <aside class="col-md-3 col-lg-2 bg-white border-end min-vh-100 p-3">
      <h5>Menu Utama</h5>
      <nav class="nav nav-pills flex-column gap-1">
        <a class="nav-link" href="index.html">Dashboard</a>
        <a class="nav-link" href="laporan.html">Laporan</a>
        <a class="nav-link" href="pengguna.html">Pengguna</a>
        <a class="nav-link active" href="pengaturan.html">Pengaturan</a>
      </nav>
    </aside>

    <main class="col-md-9 col-lg-10 p-4">
      <h1>Pengaturan</h1>
      <p class="text-secondary">Atur informasi admin.</p>

      <div class="card shadow-sm">
        <div class="card-body">
          <form id="formPengaturan">
            <div class="mb-3">
              <label for="namaAdmin" class="form-label">Nama Admin</label>
              <input type="text" class="form-control" id="namaAdmin"
                     value="Admin" required>
            </div>
            <div class="mb-3">
              <label for="emailAdmin" class="form-label">Email</label>
              <input type="email" class="form-control" id="emailAdmin"
                     value="admin@example.com" required>
            </div>
            <button type="submit" class="btn btn-primary">Simpan Pengaturan</button>
            <a href="index.html" class="btn btn-secondary">Kembali</a>
          </form>
          <div id="pesan" class="alert alert-success mt-3 d-none">
            Pengaturan berhasil disimpan untuk simulasi ini.
          </div>
        </div>
      </div>

      <footer class="border-top mt-5 pt-3 text-center text-secondary">
        &copy; 2026 Muhammad Al Faruq
      </footer>
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script>
  document.getElementById("formPengaturan").addEventListener("submit", function(event) {
    event.preventDefault();
    document.getElementById("pesan").classList.remove("d-none");
  });
</script>
</body>
</html>
