
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Logout</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="index.html">Admin Panel</a>
  </div>
</nav>

<div class="container-fluid">
  <div class="row">
    <aside class="col-md-3 col-lg-2 bg-white border-end min-vh-100 p-3">
      <h5>Menu Utama</h5>
      <nav class="nav nav-pills flex-column gap-1">
        <a class="nav-link" href="index.html">Dashboard</a>
        <a class="nav-link" href="laporan.html">Laporan</a>
        <a class="nav-link" href="pengguna.html">Pengguna</a>
        <a class="nav-link" href="pengaturan.html">Pengaturan</a>
      </nav>
    </aside>

    <main class="col-md-9 col-lg-10 p-4">
      <div class="card shadow-sm mx-auto mt-5" style="max-width: 500px;">
        <div class="card-body text-center p-4">
          <h1 class="h3">Konfirmasi Logout</h1>
          <p class="text-secondary">
            Apakah kamu yakin ingin keluar dari halaman admin?
          </p>

          <a href="index.html" class="btn btn-secondary">Batal</a>
          <button class="btn btn-danger" id="tombolLogout">Ya, Logout</button>

          <div id="pesanLogout" class="alert alert-success mt-3 d-none">
            Logout simulasi berhasil. Silakan tutup halaman ini.
          </div>
        </div>
      </div>

      <footer class="border-top mt-5 pt-3 text-center text-secondary">
        &copy; 2026 Muhammad Al Faruq
      </footer>
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script>
  document.getElementById("tombolLogout").addEventListener("click", function() {
    document.getElementById("pesanLogout").classList.remove("d-none");
    this.disabled = true;
    this.textContent = "Sudah Logout";
  });
</script>
</body>
</html>
